<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaskFlow - Mobile Daily Task Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Prevent pull-to-refresh or text-selection friction on mobile */
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 min-h-screen text-slate-800 dark:text-slate-100 flex flex-col justify-between transition-colors duration-200">

    <div class="max-w-md w-full mx-auto p-4 sm:p-6 my-0 sm:my-10 bg-white dark:bg-slate-900 rounded-none sm:rounded-3xl shadow-none sm:shadow-2xl border-0 sm:border border-slate-200 dark:border-slate-800 flex flex-col h-screen sm:h-auto">
        
        <!-- App Header -->
        <header class="flex items-center justify-between mb-5 pt-2 sm:pt-0">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-indigo-600 dark:text-indigo-400 tracking-tight flex items-center gap-2">
                    <i class="fa-solid fa-list-check"></i> TaskFlow
                </h1>
                <p class="text-xs sm:text-sm text-slate-400 dark:text-slate-500 mt-0.5">Conquer your day, one task at a time.</p>
            </div>
            <!-- Dark Mode Toggle Button -->
            <button onclick="toggleDarkMode()" aria-label="Toggle Dark Mode" class="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-yellow-400 transition hover:scale-105 active:scale-95">
                <i id="dark-mode-icon" class="fa-solid fa-moon text-lg"></i>
            </button>
        </header>

        <!-- Progress Bar -->
        <div class="mb-5 bg-slate-50 dark:bg-slate-800/50 p-3.5 rounded-2xl border border-slate-100 dark:border-slate-800">
            <div class="flex justify-between text-xs font-semibold mb-2">
                <span id="progress-text">Progress: 0%</span>
                <span id="task-count" class="text-indigo-600 dark:text-indigo-400">0 tasks left</span>
            </div>
            <div class="w-full bg-slate-200 dark:bg-slate-700 h-2 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-indigo-600 dark:bg-indigo-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <!-- Add Task Form -->
        <form id="task-form" class="space-y-2.5 mb-5">
            <div class="flex flex-col sm:flex-row gap-2">
                <input 
                    type="text" 
                    id="task-input" 
                    placeholder="What needs to be done?" 
                    required
                    class="flex-1 px-4 py-3.5 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                >
                <input 
                    type="date" 
                    id="date-input" 
                    class="px-3.5 py-3.5 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                >
            </div>
            <button 
                type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold py-3.5 rounded-2xl transition duration-200 flex items-center justify-center gap-2 text-sm shadow-lg shadow-indigo-600/20"
            >
                <i class="fa-solid fa-plus"></i> Add Task
            </button>
        </form>

        <!-- Filters & Clear Bar -->
        <div class="flex items-center justify-between mb-3 border-b border-slate-100 dark:border-slate-800 pb-3">
            <div class="flex gap-1.5">
                <button onclick="setFilter('all')" id="filter-all" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 transition">All</button>
                <button onclick="setFilter('active')" id="filter-active" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-400 dark:text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition">Active</button>
                <button onclick="setFilter('completed')" id="filter-completed" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-400 dark:text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition">Done</button>
            </div>
            <button onclick="clearCompletedTasks()" class="text-xs font-medium text-slate-400 hover:text-rose-500 dark:hover:text-rose-400 transition">Clear Done</button>
        </div>

        <!-- Task List Container (Scrollable) -->
        <div class="flex-1 overflow-y-auto min-h-[200px] max-h-[350px] sm:max-h-[280px] pr-1">
            <ul id="task-list" class="space-y-2.5">
                <!-- Dynamic tasks populated here -->
            </ul>
            
            <!-- Empty State -->
            <div id="empty-state" class="text-center py-12 text-slate-400 dark:text-slate-600 hidden">
                <i class="fa-regular fa-face-smile text-4xl mb-2"></i>
                <p class="text-sm">All caught up! Time to relax.</p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-400 dark:text-slate-600 hidden sm:block">
        TaskFlow Mobile &bull; Optimized for your phone
    </footer>

    <!-- Application Logic -->
    <script>
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let currentFilter = 'all';

        // Elements
        const taskForm = document.getElementById('task-form');
        const taskInput = document.getElementById('task-input');
        const dateInput = document.getElementById('date-input');
        const taskList = document.getElementById('task-list');
        const emptyState = document.getElementById('empty-state');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const taskCount = document.getElementById('task-count');
        const darkModeIcon = document.getElementById('dark-mode-icon');

        // Set default date to today
        dateInput.valueAsDate = new Date();

        // Initialize Dark Mode preference from local storage
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            darkModeIcon.className = "fa-solid fa-sun text-lg";
        } else {
            document.documentElement.classList.remove('dark');
            darkModeIcon.className = "fa-solid fa-moon text-lg";
        }

        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                darkModeIcon.className = "fa-solid fa-moon text-lg";
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                darkModeIcon.className = "fa-solid fa-sun text-lg";
            }
        }

        // Add task event
        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = taskInput.value.trim();
            const dueDate = dateInput.value;
            if(!text) return;

            const newTask = {
                id: Date.now(),
                text: text,
                dueDate: dueDate,
                completed: false
            };

            tasks.push(newTask);
            saveAndRender();
            taskInput.value = '';
            dateInput.valueAsDate = new Date();
            taskInput.blur(); // Dismiss mobile keyboard
        });

        function saveAndRender() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function toggleTask(id) {
            tasks = tasks.map(task => task.id === id ? { ...task, completed: !task.completed } : task);
            saveAndRender();
        }

        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveAndRender();
        }

        function clearCompletedTasks() {
            tasks = tasks.filter(task => !task.completed);
            saveAndRender();
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-400 dark:text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition";
            });
            document.getElementById(`filter-${filter}`).className = "filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 transition";
            renderTasks();
        }

        function renderTasks() {
            let filteredTasks = tasks;
            if(currentFilter === 'active') {
                filteredTasks = tasks.filter(t => !t.completed);
            } else if(currentFilter === 'completed') {
                filteredTasks = tasks.filter(t => t.completed);
            }

            taskList.innerHTML = '';
            
            if(filteredTasks.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                filteredTasks.forEach(task => {
                    const li = document.createElement('li');
                    li.className = `flex items-center justify-between p-3.5 rounded-2xl border transition duration-150 ${task.completed ? 'bg-slate-50/50 dark:bg-slate-800/30 border-slate-100 dark:border-slate-800/50 text-slate-400 dark:text-slate-600' : 'bg-slate-50 dark:bg-slate-800/80 border-slate-100 dark:border-slate-800'}`;
                    
                    let formattedDate = '';
                    if(task.dueDate) {
                        const dateObj = new Date(task.dueDate + 'T00:00:00');
                        formattedDate = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                    }

                    li.innerHTML = `
                        <div class="flex items-center gap-3 overflow-hidden flex-1 mr-2">
                            <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="toggleTask(${task.id})" class="w-5 h-5 text-indigo-600 rounded-md border-slate-300 dark:border-slate-600 focus:ring-indigo-500 cursor-pointer shrink-0">
                            <div class="truncate flex-1">
                                <p class="text-sm font-medium ${task.completed ? 'line-through text-slate-400 dark:text-slate-600' : 'text-slate-700 dark:text-slate-200'}">${escapeHTML(task.text)}</p>
                                ${task.dueDate ? `<span class="text-[10px] text-slate-400 dark:text-slate-500 flex items-center gap-1 mt-0.5"><i class="fa-regular fa-calendar"></i> ${formattedDate}</span>` : ''}
                            </div>
                        </div>
                        <button onclick="deleteTask(${task.id})" class="text-slate-300 dark:text-slate-600 hover:text-rose-500 dark:hover:text-rose-400 transition p-2 shrink-0">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    `;
                    taskList.appendChild(li);
                });
            }
            updateProgress();
        }

        function updateProgress() {
            const totalTasks = tasks.length;
            const completedTasks = tasks.filter(t => t.completed).length;
            const activeTasks = totalTasks - completedTasks;
            const percent = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);
            
            progressBar.style.width = `${percent}%`;
            progressText.innerText = `Progress: ${percent}%`;
            taskCount.innerText = `${activeTasks} task${activeTasks === 1 ? '' : 's'} left`;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        renderTasks();
    </script>
</body>
</html>
